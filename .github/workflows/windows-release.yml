name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-release.yml"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download FFmpeg and ffprobe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "ffmpeg/bin" | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_dist" -Force
          $ffmpeg = Get-ChildItem "ffmpeg_dist" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem "ffmpeg_dist" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg binaries were not found after extraction." }
          Copy-Item $ffmpeg.FullName "ffmpeg/bin/ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "ffmpeg/bin/ffprobe.exe" -Force

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build Dubora application
        shell: pwsh
        run: |
          $pyDll = python -c "import sys,pathlib; print(pathlib.Path(sys.base_prefix) / f'python{sys.version_info.major}{sys.version_info.minor}.dll')"
          if (-not (Test-Path $pyDll)) { throw "Python runtime DLL was not found: $pyDll" }

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --contents-directory "_internal" `
            --name "Dubora" `
            --icon "assets/dubora.ico" `
            --collect-all "webview" `
            --add-binary "$pyDll;." `
            --add-data "ui;ui" `
            --add-data "assets;assets" `
            --add-data "ffmpeg/bin;ffmpeg/bin" `
            --add-data "gateway_url.txt;." `
            app.py

          if (-not (Test-Path "dist/Dubora/Dubora.exe")) { throw "Dubora.exe was not created." }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            "C:/Program Files (x86)/Inno Setup 6/ISCC.exe",
            "C:/Program Files/Inno Setup 6/ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found." }
          & $iscc "Dubora_Setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed." }
          if (-not (Test-Path "installer/Dubora-Setup.exe")) { throw "Dubora-Setup.exe was not created." }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.0.0 "installer/Dubora-Setup.exe" --clobber
          } else {
            gh release create v1.0.0 "installer/Dubora-Setup.exe" `
              --target "${{ github.sha }}" `
              --title "Dubora v1.0.0" `
              --notes "Windows release of Dubora, an AI-powered desktop video translator for Arabic subtitles with preserved timing."
          }
